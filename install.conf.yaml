- clean: ['~']

- shell:
  - [./install-homebrew.sh, Installing Homebrew]
  - [mkdir -p ~/workspace, Creating ~/workspace]
  # a plain clone, not a submodule: this is where the plugins are developed. Never pulled here.
  - [test -d ~/workspace/k9s-plugins || git clone https://github.com/voelzmo/k9s-plugins.git ~/workspace/k9s-plugins, Cloning k9s-plugins]
  - [./configure-git, Setting up gitconfig]
  - [./brew-auto-update/install.sh, Installing automated brew upgrade]
  # needs sudo on the first run, hence stdin. The login window step is manual, see README.
  - command: ./install-keyboard-layout.sh
    description: Installing the umlauts keyboard layout
    stdin: true
    stdout: true
    stderr: true

- link:
    ~/.zshrc: zshrc
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.config/starship.toml:
      create: true
      path: starship.toml
    ~/.config/mise/config.toml:
      create: true
      path: mise-config.toml
    # don't install gem documentation, that takes often longer than the gem itself
    ~/.gemrc:
      path: gemrc
      force: true
    # core.excludesfile points here, see configure-git. 'force' replaces a pre-existing plain file;
    # its contents are already part of the tracked gitignore.
    ~/.gitignore:
      path: gitignore
      force: true
    ~/Library/Preferences/com.googlecode.iterm2.plist: com.googlecode.iterm2.plist
    ~/Library/Application Support/Code/User/settings.json:
      create: true
      path: vscode-settings.json
    # k9s loads every file from this directory. Symlinking from the clone makes 'git pull' there update them.
    ~/Library/Application Support/k9s/plugins/:
      create: true
      glob: true
      path: ~/workspace/k9s-plugins/plugins/*.yaml

- shell:
  - [brew bundle]
  - [mise install, Installing ruby via mise]
  - [kubectl krew install < kubectl-krew-plugins.txt]
  - [gcloud components install gke-gcloud-auth-plugin]
